<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#8B2B1A"/>
  <!-- Stylized reaching hands inspired by The Creation of Adam -->
  <g stroke="#FAF7F2" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.9">
    <!-- Left hand (Adam) reaching right -->
    <path d="M5 20 Q8 18 11 16.5 Q12 16 13 15.5"/>
    <path d="M11 16.5 Q11.5 14.5 12 13"/>
    <path d="M12 16 Q12.5 14 13 12.5"/>
    <path d="M13 15.5 Q13.5 13.5 14 12"/>
    <!-- Right hand (God) reaching left -->
    <path d="M27 14 Q24 14.5 21 15.5 Q20 16 19 16.5"/>
    <path d="M21 15.5 Q20.5 13.5 20 12"/>
    <path d="M20 16 Q19.5 14 19 12.5"/>
    <path d="M19 16.5 Q18.5 14.5 18 13"/>
  </g>
  <!-- The gap — the divine spark -->
  <circle cx="16" cy="16" r="1" fill="#D4A84B" opacity="0.95"/>
  <circle cx="16" cy="16" r="2" fill="#D4A84B" opacity="0.15"/>
</svg>
